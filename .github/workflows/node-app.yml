name: node CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Log in to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # needed to tag image
      - name: Set IMAGE_TAG
        id: vars
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi
   
      # Build Docker images
      - name: Build Docker images
        run: |
          docker compose -f node.js_project/docker-compose.yml build my-app:${IMAGE_TAG}
        env: 
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
     
      # Tag the image for ECR
      #- name: Tag Docker image
       # run: |
       #  docker tag my-app *****.amazonaws.com/my-app:1.0

      # Tag and Push the image to ECR
       # docker push ${{ steps.login-ecr.outputs.registry }}/my-app:1.0
       # docker compose -f node.js_project/docker-compose.yml push
      - name: Push image to ECR
        run: |
          docker tag my-app ${{ steps.login-ecr.outputs.registry }}/my-app:${IMAGE_TAG}
          docker push ${{ steps.login-ecr.outputs.registry }}/my-app:${IMAGE_TAG}
          

      # Output final image URL
      - name: Image URL
        run: echo "✅ Image pushed to:${{ steps.login-ecr.outputs.registry }}/my-app:${IMAGE_TAG}"

      # Upload artifact so it can be downloaded
      #- name: Upload app Docker image artifact
      #  uses: actions/upload-artifact@v4
